name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --tb=short --no-header --cov-report=xml:coverage.xml

      - name: Coverage summary
        run: python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY

  # The core matrix above installs only ".[dev]", so there the adapter tests skip and
  # pyproject.toml leaves the adapter modules out of the coverage count. This job installs
  # the frameworks (CPU torch, so no CUDA wheels), runs the adapter tests against real tiny
  # training runs and holds the adapter modules to the same 90% floor on their own.
  adapters:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU-only PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple

      - name: Install dependencies
        run: pip install -e ".[dev,all]" trl pytorch-lightning  # trl backs the TRL test; pytorch-lightning the older-package test

      - name: Run adapter tests
        run: >
          python -m pytest tests/test_adapter_support.py tests/test_lightning.py tests/test_transformers.py tests/test_trl.py
          -q --tb=short --no-header -o addopts=""
          --cov --cov-config=.coveragerc-adapters --cov-report=term-missing --cov-report=xml:coverage-adapters.xml

      - name: Run the framework examples
        # The core job runs the other examples (tests/test_examples.py); these two need the frameworks.
        env:
          PACE_MIN_INTERVAL: "0"
          PACE_BAR: never
        run: |
          python examples/lightning_example.py > lightning.log
          python examples/transformers_example.py > transformers.log
          python skills/adopt-pace/verify.py --strict lightning.log
          python skills/adopt-pace/verify.py --strict transformers.log

      - name: Coverage summary
        run: python -m coverage report --rcfile=.coveragerc-adapters --format=markdown >> $GITHUB_STEP_SUMMARY
