name: Unit Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest]
        include:
          # actions/setup-python has no Python 3.8 build for ubuntu-24.04 (ubuntu-latest),
          # so the oldest supported version runs on 22.04 instead.
          - python-version: "3.8"
            os: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q --tb=short --no-header --cov-report=xml:coverage.xml

      - name: Coverage summary
        run: python -m coverage report --format=markdown >> $GITHUB_STEP_SUMMARY
