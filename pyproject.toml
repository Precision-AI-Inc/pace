# ── Project identity ──────────────────────────────────────────────────────────

[build-system]
requires = ["setuptools>=61", "wheel", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "precisionai-pace"
dynamic = ["version"]
description = "Precision AI — a logger with progress reporting whose output also tells you, or a scheduler, when the job will finish."
readme = "README.md"
license = { file = "LICENSE.md" }
authors = [{ name = "Precision AI", email = "michael@precision.ai" }]
maintainers = [{ name = "Precision AI", email = "michael@precision.ai" }]
# The core has no dependencies and runs on 3.8, so it can go into older training
# images and into packages that still support 3.8. Optional adapters inherit the
# minimum of the framework they wrap.
requires-python = ">=3.8"
keywords = [
    "logging",
    "progress",
    "eta",
    "machine-learning",
    "training",
    "scheduling",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Logging",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Deliberately empty: the core must never pull anything into a user's image.
dependencies = []

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7; python_version >= '3.9'",
    "pyright>=1.1",
    "genbadge[coverage]>=1.1",
]
lightning = ["lightning>=2.0"]
transformers = ["transformers>=4.36", "accelerate>=0.26"]
all = [
    "lightning>=2.0",
    "transformers>=4.36",
    "accelerate>=0.26",
]

[project.urls]
Homepage = "https://github.com/Precision-AI-Inc/pace"
Repository = "https://github.com/Precision-AI-Inc/pace"
Issues = "https://github.com/Precision-AI-Inc/pace/issues"
Changelog = "https://github.com/Precision-AI-Inc/pace/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["precisionai*"]

[tool.setuptools_scm]
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"
fallback_version = "0.0.0"

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--cov=precisionai --cov-report=term-missing --cov-fail-under=90"
markers = [
    "integration: marks tests that require external resources (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["precisionai"]
# The framework adapters need a framework the core test matrix does not install, so the
# core run does not count them. CI measures them in the adapters job (.coveragerc-adapters).
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/precisionai/pace/lightning.py",
    "*/precisionai/pace/transformers.py",
]
relative_files = true
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError",
    "if TYPE_CHECKING:",
]

# ── pyright ───────────────────────────────────────────────────────────────────
[tool.pyright]
pythonVersion = "3.8"
typeCheckingMode = "standard"
reportMissingImports = false
reportMissingModuleSource = false

# ── ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "PT",   # flake8-pytest-style
    "RUF",  # ruff-specific rules
    "PL",   # pylint
    "ANN",  # flake8-annotations — enforce PEP 484 type hints
    "PERF", # perflint — performance anti-patterns
    "S",    # flake8-bandit — security linting
    "FA",   # flake8-future-annotations — `X | Y` hints need the __future__ import on 3.8
]
ignore = [
    "E501",    # line too long — enforced by ruff-format at 120 chars
    "SIM108",  # ternary operator — sometimes less readable
    "D100",    # missing docstring in public module
    "D104",    # missing docstring in public package
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "PLR0913", # too many arguments — progress scopes take several optional fields
    "PLR2004", # magic value comparisons — acceptable in tests
    "ANN401",  # typing.Any is allowed for genuinely dynamic types
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**"       = ["D", "PLR", "ANN", "S"]
"examples/**"    = ["D"]
"docs/conf.py"   = ["E402", "UP031", "ANN", "S", "FA"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["precisionai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
